<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>店员收货登记</title>
<style>
  :root{
    --bg:#f5f3ee; --card:#ffffff; --ink:#1d2421; --sub:#6b726e; --line:#dcd8cd;
    --ok:#1f6f4a; --okbg:#e3f1e9; --bad:#b3261e; --badbg:#fbe9e7;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#161a18; --card:#1f2421; --ink:#e8ebe9; --sub:#9aa39e; --line:#333a36;
      --ok:#5fcf9a; --okbg:#1c3328; --bad:#ff8a80; --badbg:#3a2220;}
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    min-height:100vh; display:flex; justify-content:center; align-items:flex-start;
    padding:max(24px,env(safe-area-inset-top)) 16px 40px;
  }
  main{width:100%; max-width:480px; margin-top:6vh}
  h1{font-size:22px; margin:0 0 6px; letter-spacing:.02em}
  .lead{color:var(--sub); font-size:14px; margin:0 0 20px; line-height:1.6}
  .box{background:var(--card); border:1px solid var(--line); border-radius:10px; padding:18px}
  label{display:block; font-size:14px; margin-bottom:8px}
  input{
    width:100%; font-size:20px; padding:12px 14px; border-radius:8px;
    border:1px solid var(--line); background:transparent; color:var(--ink);
    font-family:ui-monospace,Menlo,Consolas,monospace; letter-spacing:.06em;
  }
  input:focus-visible,button:focus-visible{outline:2px solid var(--ok); outline-offset:2px}
  .row{display:flex; gap:10px; margin-top:12px}
  button{
    flex:1; font-size:16px; padding:12px; border-radius:8px; cursor:pointer;
    border:1px solid var(--ink); background:var(--ink); color:var(--bg);
  }
  button.ghost{background:transparent; color:var(--ink); border-color:var(--line); flex:0 0 88px}
  #result{margin-top:16px; display:none}
  .status{padding:12px 14px; border-radius:8px; font-weight:600; font-size:16px}
  .status.ok{background:var(--okbg); color:var(--ok)}
  .status.bad{background:var(--badbg); color:var(--bad)}
  dl{margin:14px 0 0; display:grid; grid-template-columns:5.5em 1fr; gap:8px 12px; font-size:15px}
  dt{color:var(--sub)} dd{margin:0}
  ul.checks{list-style:none; padding:0; margin:14px 0 0; font-size:14px}
  ul.checks li{padding:4px 0}
  ul.checks .y{color:var(--ok)} ul.checks .n{color:var(--bad)}
  .note{font-size:12px; color:var(--sub); line-height:1.7; margin-top:18px}
  #pendlist{margin-top:10px}
  #pendlist .none{font-size:13px; color:var(--sub); line-height:1.6}
  #pendlist button.pend{
    display:flex; justify-content:space-between; width:100%; text-align:left; flex:none;
    margin-top:8px; font-size:15px; padding:10px 12px; background:transparent;
    color:var(--ink); border:1px solid var(--line);
  }
  #pendlist button.pend.on{border-color:var(--ok); background:var(--okbg)}
  #pendlist button.pend span{color:var(--sub); font-size:13px}
  #curbar{display:none; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; font-size:13px; color:var(--sub)}
  #curbar button{flex:0 0 auto; padding:8px 12px; font-size:14px}
  #cardbox{display:none; margin-top:16px}
  #card{width:100%; height:auto; border-radius:8px; border:1px solid var(--line)}
  input.pw{font-size:16px; letter-spacing:normal; font-family:inherit; margin-top:12px}
  #loginPanel{margin-top:18px}
  #loginPanel input{font-family:inherit;letter-spacing:normal}
  #loginMsg{font-size:13px;line-height:1.6;margin-top:10px;color:var(--sub)}
  .remember{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px}
  .remember input{width:18px;height:18px;margin:0}
  #logout{margin-bottom:12px}
  #upmsg{font-size:13px; margin-top:10px; min-height:1.4em; color:var(--sub)}
  #upmsg.err{color:var(--bad)} #upmsg.ok{color:var(--ok)}
  input.name{font-size:18px; letter-spacing:.04em; font-family:inherit; margin-bottom:14px}
  .items-head,.item-row{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;align-items:center}
  .items-head{font-size:13px;color:var(--sub);margin:10px 0 6px}
  .item-row{margin:7px 0}
  .item-row input{font-family:inherit;font-size:15px;letter-spacing:normal;padding:10px 8px;min-width:0}
</style>
</head>
<body>
<main>
  <h1>店员收货登记</h1>
  <p class="lead">核对顾客资料，填写物品明细，生成并保存收货登记图片。</p>

  <div id="loginPanel" class="box">
    <h2 style="font-size:18px;margin:0 0 8px">店员登录</h2>
    <p class="lead" style="margin-bottom:10px">请输入店员密码，通过服务器验证后进入工作界面。</p>
    <label for="pw">店员密码</label>
    <input id="pw" class="pw" type="password" autocomplete="current-password" placeholder="请输入店员密码">
    <label class="remember"><input id="showPw" type="checkbox">显示密码</label>
    <label class="remember"><input id="rememberPw" type="checkbox">记住密码（仅保存在本设备浏览器）</label>
    <div class="row"><button id="loginBtn" type="button">登录进入</button></div>
    <div id="loginMsg" role="status" aria-live="polite"></div>
  </div>

  <div id="workarea" style="display:none">
  <div class="row"><button id="logout" class="ghost" type="button">退出登录</button></div>
  <div class="box">
    <div class="scan">
      <div class="row"><button id="refresh" class="ghost" style="flex:1">查看顾客提交</button></div>
      <div id="pendlist"></div>
      <div id="customerDetail" style="display:none;margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;font-size:14px;line-height:1.8;overflow-wrap:anywhere"></div>
      <div id="curbar">
        <span id="curtxt"></span>
        <button id="rej" class="ghost">删除这条</button>
      </div>
    </div>

    <label for="name">姓名</label>
    <input id="name" class="name" autocomplete="off" spellcheck="false" placeholder="请输入姓名">

    <label for="idno">身份证号码（18 位，或 15 位旧号）</label>
    <input id="idno" inputmode="text" autocomplete="off" autocapitalize="characters"
           spellcheck="false" maxlength="18" placeholder="请输入号码">
    <div class="row">
      <button id="go">校验</button>
      <button id="clear" class="ghost">清空</button>
    </div>

    <section class="box" style="margin-top:16px">
      <h2 style="font-size:18px;margin:0 0 8px">物品明细（最多 5 行）</h2>
      <p class="lead" style="margin-bottom:12px">每行填写品种、单价和总额；未填写的行会在图片中留空。</p>
      <div class="items-head"><span>品种</span><span>单价</span><span>总额</span></div>
      <div id="itemRows"></div>
      <div class="row"><button id="refreshCard" type="button">更新登记图片</button></div>
    </section>

    <div id="result" aria-live="polite">
      <div id="status" class="status"></div>
      <ul id="checks" class="checks"></ul>
      <dl id="info"></dl>

      <div id="cardbox">
        <canvas id="card" width="1000" height="1000"></canvas>
        <div class="row">
          <button id="save" class="ghost" style="flex:1">保存到手机</button>
          <button id="up" style="flex:1">上传到云端</button>
        </div>
        <div id="upmsg" aria-live="polite"></div>
      </div>
    </div>
  </div>

  <p class="note">
    登记图片只在当前设备生成并可保存到手机；确认存档时，服务器只保存登记文字资料和物品明细，不保存登记图片。顾客照片和签名仅存在待确认记录中，确认或删除后会从待确认记录删除。<br>
    本工具只能判断号码“合不合规”，不能证明这个号码真的登记在某个人名下。要核实真实身份，需要使用公安部门授权的实名核验接口。
  </p>
  </div>
</main>

<script>
(function(){
  var PROVINCES = {
    11:"北京",12:"天津",13:"河北",14:"山西",15:"内蒙古",
    21:"辽宁",22:"吉林",23:"黑龙江",
    31:"上海",32:"江苏",33:"浙江",34:"安徽",35:"福建",36:"江西",37:"山东",
    41:"河南",42:"湖北",43:"湖南",44:"广东",45:"广西",46:"海南",
    50:"重庆",51:"四川",52:"贵州",53:"云南",54:"西藏",
    61:"陕西",62:"甘肃",63:"青海",64:"宁夏",65:"新疆",
    71:"台湾",81:"香港",82:"澳门"
  };
  var WEIGHTS = [7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2];
  var CHECK = ["1","0","X","9","8","7","6","5","4","3","2"];

  function pad(n){ return n < 10 ? "0" + n : "" + n; }

  function calcCheck(first17){
    var sum = 0;
    for (var i = 0; i < 17; i++) sum += parseInt(first17[i], 10) * WEIGHTS[i];
    return CHECK[sum % 11];
  }

  function validDate(y, m, d){
    var dt = new Date(y, m - 1, d);
    return dt.getFullYear() === y && dt.getMonth() === m - 1 && dt.getDate() === d;
  }

  function validate(raw){
    var s = raw.trim().toUpperCase();
    var checks = [];
    var converted = false;

    // 15 位旧号：补 19 + 计算校验位，转成 18 位
    if (/^\d{15}$/.test(s)) {
      s = s.slice(0, 6) + "19" + s.slice(6);
      s += calcCheck(s);
      converted = true;
    }

    var fmtOk = /^\d{17}[\dX]$/.test(s);
    checks.push({ok: fmtOk, text: "长度与字符：18 位，前 17 位为数字，末位为数字或 X"});
    if (!fmtOk) return {valid:false, checks:checks};

    var prov = parseInt(s.slice(0, 2), 10);
    var provOk = !!PROVINCES[prov];
    checks.push({ok: provOk, text: "地区码：前两位 " + s.slice(0, 2) + (provOk ? "（" + PROVINCES[prov] + "）" : " 不是有效的省级代码")});

    var y = parseInt(s.slice(6, 10), 10), m = parseInt(s.slice(10, 12), 10), d = parseInt(s.slice(12, 14), 10);
    var now = new Date();
    var dateOk = validDate(y, m, d) && y >= 1900 && new Date(y, m - 1, d) <= now;
    checks.push({ok: dateOk, text: "出生日期：" + y + "-" + pad(m) + "-" + pad(d) + (dateOk ? "" : " 不存在或晚于今天")});

    var expect = calcCheck(s.slice(0, 17));
    var sumOk = expect === s[17];
    checks.push({ok: sumOk, text: "校验位：应为 " + expect + "，实际为 " + s[17]});

    var valid = provOk && dateOk && sumOk;
    var info = null;
    if (provOk && dateOk) {
      var age = now.getFullYear() - y;
      if (now.getMonth() + 1 < m || (now.getMonth() + 1 === m && now.getDate() < d)) age--;
      info = {
        id18: s,
        converted: converted,
        province: PROVINCES[prov],
        birth: y + " 年 " + m + " 月 " + d + " 日",
        gender: parseInt(s[16], 10) % 2 === 1 ? "男" : "女",
        age: age
      };
    }
    return {valid:valid, checks:checks, info:info};
  }

  var $ = function(id){ return document.getElementById(id); };
  var input = $("idno"), result = $("result");

  function esc(t){
    return String(t).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }

  function run(){
    var v = input.value;
    if (!v.trim()) { result.style.display = "none"; return; }
    var r = validate(v);
    lastR = r;
    result.style.display = "block";
    $("cardbox").style.display = (r.valid && r.info) ? "block" : "none";
    $("upmsg").textContent = "";
    if (r.valid && r.info) drawCard();

    var st = $("status");
    st.className = "status " + (r.valid ? "ok" : "bad");
    st.textContent = r.valid ? "号码合规" : "号码不合规";

    $("checks").innerHTML = r.checks.map(function(c){
      return '<li><span class="' + (c.ok ? "y" : "n") + '">' + (c.ok ? "通过" : "未通过") + "</span>　" + esc(c.text) + "</li>";
    }).join("");

    var dl = $("info");
    if (r.info) {
      var rows = [
        ["归属省份", r.info.province],
        ["出生日期", r.info.birth],
        ["性别", r.info.gender],
        ["年龄", r.info.age + " 岁"]
      ];
      if (r.info.converted) rows.push(["转换后号码", r.info.id18]);
      dl.innerHTML = rows.map(function(x){
        return "<dt>" + esc(x[0]) + "</dt><dd>" + esc(x[1]) + "</dd>";
      }).join("");
    } else {
      dl.innerHTML = "";
    }
  }

  $("go").addEventListener("click", run);
  input.addEventListener("keydown", function(e){ if (e.key === "Enter") run(); });
  $("clear").addEventListener("click", function(){
    input.value = ""; $("name").value = ""; clearCur();
    result.style.display = "none"; input.focus();
  });

  /* ---------- 资料卡片：绘制 / 保存 / 上传 ---------- */
  // 部署 Worker 后，把这里改成你的 Worker 地址，例如 https://idcard.xxx.workers.dev
  var UPLOAD_URL = "https://idcard.a1269136698a.workers.dev";

  var lastR = null;
  var cardCanvas = $("card");
  var itemRows = $("itemRows");
  for (var rowIndex = 0; rowIndex < 5; rowIndex++) {
    var row = document.createElement("div"); row.className = "item-row";
    row.innerHTML = '<input aria-label="第' + (rowIndex+1) + '行品种" placeholder="品种" data-item="name">' +
      '<input aria-label="第' + (rowIndex+1) + '行单价" placeholder="单价" inputmode="decimal" data-item="price">' +
      '<input aria-label="第' + (rowIndex+1) + '行总额" placeholder="总额" inputmode="decimal" data-item="amount">';
    itemRows.appendChild(row);
  }
  function getItems(){
    return Array.from(itemRows.querySelectorAll('.item-row')).map(function(row){
      return {name:row.querySelector('[data-item="name"]').value.trim(),price:row.querySelector('[data-item="price"]').value.trim(),amount:row.querySelector('[data-item="amount"]').value.trim()};
    });
  }
  itemRows.addEventListener('input', function(){ if(lastR && lastR.valid) drawCard(); });
  $("refreshCard").addEventListener("click", function(){ if(lastR && lastR.valid) drawCard(); else alert("请先输入并校验身份证号码，再生成登记图片。"); });

  function drawCard(){
    if (!lastR || !lastR.info) return;
    var i = lastR.info, c = cardCanvas, g = c.getContext("2d");
    var bg = "#faf8f3", ink = "#1d2421", sub = "#6b726e", line = "#dcd8cd", accent = "#1f6f4a";
    g.fillStyle = bg; g.fillRect(0, 0, c.width, c.height);
    g.strokeStyle = line; g.lineWidth = 2; g.strokeRect(20, 20, c.width - 40, c.height - 40);
    var font = '"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif';
    g.textBaseline = "alphabetic";
    g.fillStyle = accent; g.font = "600 38px " + font; g.fillText("收货登记单", 60, 85);
    g.fillStyle = sub; g.font = "25px " + font;
    var d = new Date();
    var ts = d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
    g.fillText("登记时间：" + ts, 60, 130);
    var basics = [["姓名",($('name').value||'').trim()||'未填写'],["身份证号码",i.id18],["性别",i.gender],["出生日期",i.birth],["归属省份",i.province]];
    var y = 185;
    basics.forEach(function(r){g.fillStyle=sub;g.font="25px "+font;g.fillText(r[0],60,y);g.fillStyle=ink;g.font="600 27px "+font;g.fillText(r[1],230,y);y+=52;});
    y += 10;
    g.fillStyle=accent;g.font="600 29px "+font;g.fillText("物品明细",60,y); y += 30;
    g.fillStyle="#e9eee9";g.fillRect(50,y,900,48);
    g.fillStyle=ink;g.font="600 24px "+font;g.fillText("品种",70,y+32);g.fillText("单价",590,y+32);g.fillText("总额",770,y+32);y+=48;
    getItems().forEach(function(item,idx){
      g.strokeStyle=line;g.beginPath();g.moveTo(50,y+54);g.lineTo(950,y+54);g.stroke();
      g.fillStyle=ink;g.font="23px "+font;
      g.fillText((idx+1)+". "+(item.name||""),70,y+35,480);
      g.fillText(item.price||"",590,y+35,150);g.fillText(item.amount||"",770,y+35,150);y+=55;
    });
    g.fillStyle=sub;g.font="20px "+font;g.fillText("身份证号码格式校验：合规",60,950);
  }

  $("name").addEventListener("input", function(){
    if (lastR && lastR.valid) drawCard();
  });

  // 登记图片只在本机生成并下载，不上传到服务器
  $("save").addEventListener("click", function(){
    var a = document.createElement("a");
    var d = new Date();
    a.href = cardCanvas.toDataURL("image/png");
    a.download = "收货登记-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + pad(d.getHours()) + pad(d.getMinutes()) + ".png";
    document.body.appendChild(a); a.click(); a.remove();
  });
  function setUp(t, cls){ var m = $("upmsg"); m.textContent = t; m.className = cls || ""; }
  $("up").addEventListener("click", function(){
    var pw = $("pw").value;
    if (!pw) { setUp("请先登录。", "err"); return; }
    if (!curId) { setUp("请先从顾客提交列表选择一条记录，再确认存档。", "err"); return; }
    var payload = {name:(curData.name||$("name").value||"").trim(), idno:(curData.idno||$("idno").value||"").trim().toUpperCase(), items:getItems()};
    var btn = $("up"); btn.disabled = true; setUp("正在确认并保存文字资料…");
    fetch(base() + "/confirm?id=" + encodeURIComponent(curId), {method:"POST", headers:{"Content-Type":"application/json", "X-Password":pw}, body:JSON.stringify(payload)})
      .then(function(res){return res.json().catch(function(){return {};}).then(function(j){if(!res.ok||!j.ok) throw new Error(j.error||("保存失败（"+res.status+"）")); return j;});})
      .then(function(){setUp("确认成功：文字资料已存档，顾客照片和签名已从待确认记录删除；登记图片未上传服务器。", "ok"); clearCur(); $("name").value=""; input.value=""; result.style.display="none"; loadPending();})
      .catch(function(e){setUp(e.message||"网络错误，保存失败。", "err");})
      .then(function(){btn.disabled=false;});
  });

  // 第一层登录：由 Worker 的 /ping 验证密码，未验证前不显示工作界面
  var loginMsg = $("loginMsg");
  try { var savedPw = localStorage.getItem("staffPassword"); if (savedPw) { $("pw").value = savedPw; $("rememberPw").checked = true; } } catch(e) {}
  $("showPw").addEventListener("change", function(){ $("pw").type = this.checked ? "text" : "password"; });
  function login(){
    var pw = $("pw").value;
    if (!pw) { loginMsg.textContent = "请输入店员密码。"; return; }
    $("loginBtn").disabled = true; loginMsg.textContent = "正在验证…";
    fetch(UPLOAD_URL.replace(/\/+$/, "") + "/ping", {headers:{"X-Password":pw}})
      .then(function(res){ if(!res.ok) throw new Error(res.status===401 ? "密码不正确。" : "验证失败，请检查网络和 Worker 配置。"); return res.json(); })
      .then(function(){
        if ($("rememberPw").checked) { try { localStorage.setItem("staffPassword", pw); } catch(e) {} }
        else { try { localStorage.removeItem("staffPassword"); } catch(e) {} }
        $("loginPanel").style.display="none"; $("workarea").style.display="block"; loginMsg.textContent=""; startPolling();
      }).catch(function(e){ loginMsg.textContent=e.message||"登录失败。"; })
      .then(function(){ $("loginBtn").disabled=false; });
  }
  $("loginBtn").addEventListener("click", login);
  $("pw").addEventListener("keydown", function(e){if(e.key==="Enter") login();});
  $("logout").addEventListener("click", function(){
    if(pollTimer){clearInterval(pollTimer);pollTimer=null;}
    pendItems=[]; clearCur(); $("workarea").style.display="none"; $("loginPanel").style.display="block";
    $("pw").value=""; try {localStorage.removeItem("staffPassword");} catch(e) {}
    $("rememberPw").checked=false; loginMsg.textContent="已退出登录。";
  });

  /* ---------- 顾客提交的待确认列表 ---------- */
  var curId = null, pollTimer = null, pendItems = [], curData = null;

  function base(){ return UPLOAD_URL.replace(/\/+$/, ""); }

  function clearCur(){
    curId = null; curData = null;
    $("curbar").style.display = "none";
    $("customerDetail").style.display = "none";
    $("customerDetail").innerHTML = "";
  }
  function renderCustomerDetail(it){
    var box=$("customerDetail");
    box.style.display="block";
    var rows=[["登记时间",it.submittedAt||fmtTime(it.time)],["姓名",it.name],["身份证号码",it.idno],["手机号码",it.mobile||"未填写"],["居住地址",it.address||"未填写"],["物品品种",it.itemtype||"未填写"]];
    box.innerHTML=rows.map(function(r){return "<div><strong>"+esc(r[0])+"：</strong>"+esc(r[1]||"")+"</div>";}).join("");
    if(it.photo && /^data:image\//.test(it.photo)) box.innerHTML += '<div style="margin-top:8px"><strong>顾客物品照片：</strong><br><img alt="顾客物品照片" src="'+it.photo+'" style="max-width:100%;max-height:220px;object-fit:contain;border:1px solid var(--line);border-radius:6px"></div>';
    if(it.signature && /^data:image\//.test(it.signature)) box.innerHTML += '<div style="margin-top:8px"><strong>顾客手写签名：</strong><br><img alt="顾客手写签名" src="'+it.signature+'" style="width:100%;max-width:350px;background:#fff;border:1px solid var(--line);border-radius:6px"></div>';
  }

  function fmtTime(ms){
    var d = new Date(ms);
    return pad(d.getHours()) + ":" + pad(d.getMinutes());
  }

  function renderPending(){
    var box = $("pendlist");
    if (!pendItems.length) { box.innerHTML = '<div class="none">暂时没有顾客提交。</div>'; return; }
    box.innerHTML = pendItems.map(function(it){
      return '<button class="pend' + (it.id === curId ? " on" : "") + '" data-id="' + esc(it.id) + '">' +
             esc(it.name) + "<span>" + esc(fmtTime(it.time)) + " 提交</span></button>";
    }).join("");
  }

  function loadPending(){
    var pw = $("pw").value;
    if (!pw) { $("pendlist").innerHTML = '<div class="none">请先输入店员密码。</div>'; return; }
    if (/你的/.test(UPLOAD_URL)) { $("pendlist").innerHTML = '<div class="none">还没有配置 UPLOAD_URL。</div>'; return; }
    fetch(base() + "/pending", {headers: {"X-Password": pw}}).then(function(res){
      if (res.status === 401) throw new Error("密码不正确");
      if (!res.ok) throw new Error("读取失败（" + res.status + "）");
      return res.json();
    }).then(function(j){
      pendItems = j.items || [];
      if (curId) { var updated=pendItems.filter(function(x){return x.id===curId;})[0]; if(updated){curData=updated;renderCustomerDetail(updated);} }
      if (curId && !pendItems.some(function(x){ return x.id === curId; })) clearCur();
      renderPending();
    }).catch(function(e){
      var t = (e && e.message && e.message.indexOf("Failed") < 0) ? e.message : "网络错误";
      $("pendlist").innerHTML = '<div class="none">' + esc(t) + "</div>";
    });
  }

  function startPolling(){
    loadPending();
    if (pollTimer) return;
    pollTimer = setInterval(function(){ if (!document.hidden && $("pw").value) loadPending(); }, 10000);
  }

  $("refresh").addEventListener("click", startPolling);

  $("pendlist").addEventListener("click", function(e){
    var b = e.target.closest("button.pend");
    if (!b) return;
    var it = pendItems.filter(function(x){ return x.id === b.getAttribute("data-id"); })[0];
    if (!it) return;
    curId = it.id; curData = it;
    $("name").value = it.name;
    input.value = it.idno;
    run();
    renderCustomerDetail(it);
    $("curtxt").textContent = "正在核对：" + it.name + "。请对照证件，确认无误后点下方“上传到云端”。";
    $("curbar").style.display = "flex";
    renderPending();
  });

  $("rej").addEventListener("click", function(){
    if (!curId || !confirm("确定删除这条顾客提交吗？删除后无法恢复。")) return;
    fetch(base() + "/reject?id=" + encodeURIComponent(curId), {
      method: "POST", headers: {"X-Password": $("pw").value}
    }).then(function(res){
      if (!res.ok) throw new Error("x");
      clearCur(); input.value = ""; $("name").value = ""; result.style.display = "none";
      loadPending();
    }).catch(function(){ alert("删除失败，请检查密码和网络。"); });
  });

})();
</script>
</body>
</html>
